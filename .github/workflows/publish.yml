name: Publish to PyPI & npm

on:
  push:
    tags:
      - 'v*'           # 推送 v0.2.0 等 tag 时触发
  workflow_dispatch:    # 允许手动触发

jobs:
  # ─── PyPI 发布 ─────────────────────────────────────────────
  publish-pypi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenAgent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Verify VERSION file matches tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Tag version:   $TAG_VERSION"
          echo "FILE version:  $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  # ─── npm 发布 ──────────────────────────────────────────────
  publish-npm:
    runs-on: ubuntu-latest
    needs: publish-pypi   # PyPI 成功后再发 npm
    defaults:
      run:
        working-directory: OpenAgent/npm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org/

      - name: Verify npm version matches tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          NPM_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:   $TAG_VERSION"
          echo "NPM version:   $NPM_VERSION"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "❌ npm version ($NPM_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Release ────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-npm]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Read CHANGELOG
        id: changelog
        working-directory: OpenAgent
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 提取当前版本的 changelog（从 ## x.y.z 到下一个 ## 之间）
          CHANGELOG=$(sed -n "/^## $VERSION/,/^## /{ /^## $VERSION/p; /^## [0-9]/d; p; }" CHANGELOG.md | head -50)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Somnia ${{ steps.version.outputs.tag }}
          body: |
            ## 📦 Somnia ${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.content }}

            ---

            **安装:**
            ```bash
            pip install somnia
            # 或升级
            pip install --upgrade somnia
            ```

            **PyPI:** https://pypi.org/project/somnia/${{ steps.version.outputs.version }}/
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
