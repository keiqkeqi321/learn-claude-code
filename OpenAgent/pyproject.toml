[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent"
version = "0.1.0"
description = "A modular AI agent CLI inspired by the full reference harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.25.0",
  "prompt_toolkit>=3.0.43",
  "tiktoken>=0.8.0",
]

[project.scripts]
openagent = "openagent.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openagent*"]
